name: Site Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Get MaterialX for MkDocs cache ID
        id: mkdocs-materialx-cache-id
        run: echo "id=$(date --utc '+%V')" >> $GITHUB_OUTPUT
      - name: Cache MaterialX for MkDocs depenencides
        uses: actions/cache@v6
        with:
          key: mkdocs-materialx-${{ steps.mkdocs-materialx-cache-id.outputs.id }}
          path: ~/.cache 
          restore-keys: |
            mkdocs-materialx-
      - name: Cache Python dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            pip-
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build site
        run: properdocs build
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    name: Deployment
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
