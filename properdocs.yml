site_name: 'HKBP Guidebook'
site_description: 'Kumpulan teks yang berhubungan dengan HKBP.'
site_author: Hans5958
site_url: https://hans5958.id/HKBP-Guidebook
nav:
  - 'Halaman Utama': index.md
  - 'Sepuluh Perintah Allah':
    - sepuluh-perintah-allah.md
    - patik-ni-debata.md
  - 'Kesaksian Iman Kristen':
    - kesaksian-iman-kristen.md
    - hata-haporseaon.md
  - 'Doa Bapa Kami':
    - doa-bapa-kami.md
    - tangiang-ale-amanami.md
  - 'Sakramen Baptisan Kudus':
    - sakramen-baptisan-kudus.md
    - pandidion.md
  - 'Sakramen Perjamuan Kudus':
    - sakramen-perjamuan-kudus.md
    - marulaon-na-badia.md
  - 'Konfesi HKBP':
    - 1951:
      - 'Bahasa Indonesia': konfesi-hkbp/1951/id.md
      - 'Bahasa Batak': konfesi-hkbp/1951/bbc.md
    - 1966:
      - 'Bahasa Indonesia': konfesi-hkbp/1966/id.md
      - 'Bahasa Batak': konfesi-hkbp/1966/bbc.md
    - Versi Buku: konfesi-hkbp/buku.md
  - 'RPP HKBP':
    - 2022:
      - 'Bahasa Indonesia': rpp-hkbp/2022/id.md
      - 'Bahasa Batak': rpp-hkbp/2022/bbc.md
    - Versi Lama: rpp-hkbp/lama.md

repo_name: Hans5958/HKBP-Guidebook
repo_url: https://github.com/Hans5958/HKBP-Guidebook

extra_css:
  - assets/stylesheets/extra.css

theme: 
  name: materialx
  topbar_style: primary
  custom_dir: overrides
  language: id
  palette:
  - media: "(prefers-color-scheme)"
    primary: indigo
    toggle:
      icon: material/brightness-auto
      name: Beralih ke mode terang
  - media: "(prefers-color-scheme: light)"
    primary: indigo
    scheme: default
    toggle:
      icon: material/brightness-7
      name: Beralih ke mode gelap
  - media: "(prefers-color-scheme: dark)"
    primary: indigo
    scheme: slate
    toggle:
      icon: material/brightness-4
      name: Beralih ke preferensi sistem
  icon:
    logo: material/library
  features:
    - announce.dismiss

markdown_extensions:
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list

plugins:
  - search
  - redirects:
      redirect_maps:
        konfesi-hkbp.md: konfesi-hkbp/buku.md
        rpp-hkbp.md: rpp-hkbp/2022/bbc.md
  - social:
      cards_layout: default